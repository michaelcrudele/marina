# Builds and tests every push to main and every pull request.
# The finished Marina.exe is attached to each run as a download (under "Artifacts"),
# so you can try a build without making a release.
name: Build and test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:   # adds a "Run workflow" button on the Actions tab

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # full history: the version's last number is the commit count

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build HarbourLauncher.slnx -c Release

      - name: Test
        run: dotnet run --project tests/HarbourLauncher.Core.Tests -c Release --no-build

      - name: Publish Marina.exe
        run: >
          dotnet publish src/HarbourLauncher.Desktop -c Release -r win-x64 --self-contained
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish

      - uses: actions/upload-artifact@v4
        with:
          name: Marina-${{ github.sha }}
          path: publish/Marina.exe
          retention-days: 14
